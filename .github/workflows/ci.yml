name: CI

on:
  # Feature branches are covered by pull_request; filtering push avoids running
  # CI twice per PR commit. Both names are listed until #11 renames master.
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: Format verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet format bogopali.slnx --verify-no-changes --verbosity diagnostic

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build bogopali.slnx --configuration Release
      - run: >-
          dotnet test --solution bogopali.slnx --configuration Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/TestResults
      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/*.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInline;MarkdownSummaryGithub
      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: CoverageReport

  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/Bogopali.Core.Tests/Bogopali.Core.Tests.csproj --configuration Release
